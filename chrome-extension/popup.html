<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 260px;
      padding: 16px;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: white;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 4px 0;
      color: #818cf8;
    }
    p {
      font-size: 11px;
      color: #94a3b8;
      margin: 0 0 14px 0;
    }
    .btn-main {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
      margin-bottom: 8px;
    }
    .btn-sub {
      width: 100%;
      padding: 8px;
      background: #1e293b;
      color: #cbd5e1;
      border: 1px solid #334155;
      border-radius: 10px;
      font-weight: 600;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h2>DefinitelyNotLoom Studio</h2>
  <p>Record your screen with floating camera bubble & pen toolbar over any website.</p>
  <button id="btn-start" class="btn-main">🎥 Record Your Screen</button>
  <button id="btn-perm" class="btn-sub">⚙️ Grant Cam & Mic Permission</button>

  <script src="popup.js"></script>
</body>
</html>
