<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 240px;
      padding: 16px;
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: white;
    }
    h2 {
      font-size: 14px;
      margin: 0 0 4px 0;
      color: #818cf8;
    }
    p {
      font-size: 11px;
      color: #94a3b8;
      margin: 0 0 16px 0;
    }
    button {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
      transition: opacity 0.2s;
    }
    button:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <h2>DefinitelyNotLoom</h2>
  <p>Record any tab or window with floating camera & live pen tool.</p>
  <button id="btn-start">🎥 Start Floating Record</button>

  <script src="popup.js"></script>
</body>
</html>
