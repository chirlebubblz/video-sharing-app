<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>DefinitelyNotLoom - Grant Camera & Mic Permissions</title>
  <style>
    body {
      background: #09090b;
      color: white;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #18181b;
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
      max-width: 420px;
    }
    h1 { font-size: 22px; font-weight: 800; margin-bottom: 12px; }
    p { font-size: 14px; color: #a1a1aa; line-height: 1.6; margin-bottom: 24px; }
    button {
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 10px 20px rgba(239, 68, 68, 0.3);
    }
    .success { color: #22c55e; font-weight: 700; display: none; margin-top: 16px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size: 40px; margin-bottom: 12px;">📹</div>
    <h1>Enable Loom Camera & Mic</h1>
    <p>Grant permission once so your floating camera bubble & recorder work seamlessly across Gmail, Google Docs, GitHub, and every website!</p>
    <button id="btn-grant">Grant Camera & Microphone Access</button>
    <div id="status-success" class="success">✓ Permissions Granted! You can close this tab now.</div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
